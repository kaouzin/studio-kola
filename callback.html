<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Studio Kola – Authorization</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.55;color:#222}</style>
</head>
<body>
<h1>Studio Kola</h1>
<p id="msg">Authorization received. Sending it to Studio Kola on this computer…</p>
<p><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></p>
<script>
// Hands the authorization code to the Studio Kola program running on this same computer (local address only).
if (location.search.indexOf("code=") !== -1) {
  setTimeout(function () { location.replace("http://127.0.0.1:8765/callback" + location.search); }, 800);
  setTimeout(function () {
    document.getElementById("msg").textContent =
      "If nothing happens, copy the full address of this page (Ctrl+A, Ctrl+C in the address bar): Studio Kola will detect it.";
  }, 4000);
}
</script>
</body>
</html>
